[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cvbench-studio"
version = "0.1.0"
description = "Local-first video annotation and truth review for CVBench"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "CVBench contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.9"]
model-adapters = ["numpy>=2,<3", "opencv-python-headless>=4.10,<5"]

[project.scripts]
cvbench-studio = "cvbench_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cvbench_studio = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
